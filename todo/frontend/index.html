<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Todo App - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div class="auth-container">

        <h1>Todo App</h1>

        <h2>Login</h2>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn"
            >
                Login
            </button>

        </form>


        <p
            id="message"
            class="message"
        ></p>


        <p class="auth-link">

            Don't have an account?

            <a href="signup.html">
                Create account
            </a>

        </p>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
